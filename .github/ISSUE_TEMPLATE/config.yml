# Blank issues MUST stay enabled. The app's built-in Help ▸ Send Feedback composes a
# pre-filled `issues/new?title=…&body=…&labels=…` URL (see Services/GitHubFeedback.swift);
# setting this to false makes GitHub ignore those parameters and forces the template
# chooser instead, which would silently break the in-app feedback button for every
# released copy — including versions already installed, which can't be changed.
blank_issues_enabled: true

